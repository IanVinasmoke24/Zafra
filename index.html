            <button type="button" class="btn btn-ghost btn-sm" id="btn-cancel-fair-visit" style="color: var(--earth-accent);">
              Cancelar confirmación
            </button>
          </div>
        </div>
      `;
    }

    return `
      <form id="fair-visit-form" class="fair-visit-form">
        <div class="fair-visit-form-title">Confirmar tu visita</div>
        <div class="fair-visit-fields-row">
          <div class="fair-visit-field">
            <label for="fair-visitor-name">Tu nombre</label>
            <input
              type="text"
              id="fair-visitor-name"
              name="visitorName"
              value="${this.escapeHtml(profile.name || "Visitante Zafra")}"
              required
            />
          </div>
          <div class="fair-visit-field fair-visit-field-sm">
            <label for="fair-visit-attendees">Asistentes</label>
            <select id="fair-visit-attendees" name="attendees">
              <option value="1">1 persona</option>
              <option value="2">2 personas</option>
              <option value="3">3 personas</option>
              <option value="4">4+ personas</option>
            </select>
          </div>
        </div>
        <div class="fair-visit-field">
          <label for="fair-visit-note">¿Qué taller o producto te interesa? (opcional)</label>
          <input
            type="text"
            id="fair-visit-note"
            name="note"
            placeholder="Ej. Taller de huerto, degustación o entrega de pedido"
          />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-confirm-fair-visit">
          Confirmar visita y generar pase
        </button>
      </form>
    `;
  }

  bindFairVisitEvents(item) {
    const form = document.getElementById("fair-visit-form");
    if (form) {
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const visitorName = String(fd.get("visitorName") || "").trim() || "Visitante Zafra";
        const attendees = Number(fd.get("attendees") || 1);
        const note = String(fd.get("note") || "").trim();
        const folio = `ZAF-${item.id.toUpperCase()}-${String(1000 + Math.floor(Math.random() * 9000))}`;

        store.saveFairVisit(item.id, {
          itemId: item.id,
          title: item.displayName,
          folio,
          visitorName,
          attendees,
          note,
          confirmedAt: new Date().toLocaleDateString("es-MX")
        });

        const box = document.getElementById("fair-visit-box");
        if (box) {
          box.innerHTML = this.renderFairVisitBox(item);
          this.bindFairVisitEvents(item);
        }

        if (this.currentRole === "consumidor" && this.consumerTab === "ferias") {
          const container = document.getElementById("main-view");
          if (container) container.innerHTML = this.renderConsumerEvents();
          this.bindRoleViewEvents();
        }

        this.showToast(`¡Visita confirmada para ${item.displayName}! Folio: ${folio}`, "success");
      });
    }

    const cancelBtn = document.getElementById("btn-cancel-fair-visit");
    if (cancelBtn) {
      cancelBtn.addEventListener("click", () => {
        store.removeFairVisit(item.id);
        const box = document.getElementById("fair-visit-box");
        if (box) {
          box.innerHTML = this.renderFairVisitBox(item);
          this.bindFairVisitEvents(item);
        }

        if (this.currentRole === "consumidor" && this.consumerTab === "ferias") {
          const container = document.getElementById("main-view");
          if (container) container.innerHTML = this.renderConsumerEvents();
          this.bindRoleViewEvents();
        }

        this.showToast("Confirmación de visita cancelada", "info");
      });
    }
  }

  initFairModalMap(item) {
    if (this.fairModalMap) {
      try { this.fairModalMap.remove(); } catch (e) {}
      this.fairModalMap = null;
    }
    const mapEl = document.getElementById("fair-modal-map");
    if (!mapEl || typeof L === "undefined") return;

    const lat = Number(item.lat) || 18.8122;
    const lng = Number(item.lng) || -98.9556;

    this.fairModalMap = L.map(mapEl, {
      zoomControl: true,
      scrollWheelZoom: false
    }).setView([lat, lng], 15);

    const topoLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 18,
      attribution: "Esri World Topo Map"
    });
    if (topoLayer && typeof topoLayer.on === "function") {
      topoLayer.on("tileerror", () => {
        if (!this.fairModalMap) return;
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: "OpenStreetMap"
        }).addTo(this.fairModalMap);
      });
    }
    topoLayer.addTo(this.fairModalMap);

    const pinIcon = L.divIcon({
      className: "fair-pin-icon-host",
      html: `<div class="fair-modal-pin"><span>📍</span></div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 30]
    });

    const marker = L.marker([lat, lng], { icon: pinIcon }).addTo(this.fairModalMap);
    const popupHtml = `
      <div class="fair-map-popup">
        <strong>${this.escapeHtml(item.displayName)}</strong>
        <div>${this.escapeHtml(item.location)}</div>
        <small>${this.escapeHtml(item.address || item.municipality || "Morelos")}</small>
      </div>
    `;
    marker.bindPopup(popupHtml);
    if (typeof marker.openPopup === "function") marker.openPopup();

    const refreshSize = () => {
      if (this.fairModalMap) this.fairModalMap.invalidateSize();
    };
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(refreshSize);
    }
    setTimeout(refreshSize, 160);

    const recenterBtn = document.getElementById("btn-recenter-fair-map");
    if (recenterBtn) {
      recenterBtn.addEventListener("click", () => {
        if (this.fairModalMap) {
          this.fairModalMap.setView([lat, lng], 15);
          if (typeof marker.openPopup === "function") marker.openPopup();
        }
      });
    }
  }

  openFairLocationModal(itemId) {
    const item = this.findFairOrWorkshop(itemId);
    if (!item || !this.modalRoot) return;

    const lat = Number(item.lat) || 18.8122;
    const lng = Number(item.lng) || -98.9556;
    const workshops = Array.isArray(item.workshops) ? item.workshops : [];
    const mapsExternalUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${lng}`)}`;

    this.modalRoot.innerHTML = `
      <div class="modal-overlay" id="modal-bg">
        <div class="modal-dialog fair-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="fair-modal-title">
          <div class="modal-dialog-header">
            <div>
              <div class="fair-modal-kicker">
                <span class="fair-num-badge" style="margin-bottom: 0;">${this.escapeHtml(item.shortType)}</span>
                <span>${this.escapeHtml(item.municipality || "Morelos")}</span>
              </div>
              <h3 class="modal-dialog-title" id="fair-modal-title">${this.escapeHtml(item.displayName)}</h3>
            </div>
            <button type="button" class="modal-dismiss-btn" id="close-modal-x" aria-label="Cerrar ventana">&times;</button>
          </div>

          <div class="modal-dialog-body fair-modal-body">
            <div class="fair-modal-grid">
              <div class="fair-modal-map-col">
                <div class="fair-modal-map-header">
                  <span>Ubicación exacta de la sede</span>
                  <small>${lat.toFixed(4)}, ${lng.toFixed(4)}</small>
                </div>
                <div id="fair-modal-map" class="fair-modal-map" aria-label="Mapa de ubicación de ${this.escapeHtml(item.displayName)}"></div>
                <div class="fair-modal-map-actions">
                  <button type="button" class="btn btn-secondary btn-sm" id="btn-recenter-fair-map">
                    Centrar ubicación
                  </button>
                  <a href="${mapsExternalUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm">
                    Abrir en Google Maps ↗
                  </a>
                </div>
                <div class="fair-modal-address-box">
                  <strong>${this.escapeHtml(item.location)}</strong>
                  <span>${this.escapeHtml(item.address || `${item.municipality || "Morelos"}, México`)}</span>
                </div>
              </div>

              <div class="fair-modal-info-col">
                <div class="fair-modal-what-box">
                  <div class="fair-modal-section-label">¿De qué es este evento / taller?</div>
                  <p class="fair-modal-description">${this.escapeHtml(item.whatItIs)}</p>

                  <div class="fair-modal-facts">
                    <div><span>Fecha:</span> <strong>${this.escapeHtml(item.date)}</strong></div>
                    ${item.schedule ? `<div><span>Horario:</span> <strong>${this.escapeHtml(item.schedule)}</strong></div>` : ""}
                    <div><span>Organiza / Imparte:</span> <strong>${this.escapeHtml(item.organizer)}</strong></div>
                    <div><span>Acceso / Cuota:</span> <strong>${this.escapeHtml(item.costLabel)}</strong></div>
                    ${item.capacity ? `<div><span>Cupo:</span> <strong>${item.bookedCount || 0} / ${item.capacity} lugares</strong></div>` : ""}
                  </div>

                  ${workshops.length ? `
                    <div class="fair-modal-workshops">
                      <div class="fair-modal-section-label" style="margin-bottom: 6px;">Actividades y talleres incluidos</div>
                      <div class="fair-card-workshops">
                        ${workshops.map(w => `<span class="fair-mini-chip">${this.escapeHtml(w)}</span>`).join("")}
                      </div>
                    </div>
                  ` : ""}
                </div>

                <div id="fair-visit-box" class="fair-visit-box">
                  ${this.renderFairVisitBox(item)}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    this.bindModalClose();
    this.bindFairVisitEvents(item);
    this.initFairModalMap(item);
  }

  bindModalClose() {
    const bg = document.getElementById("modal-bg");
    const closeX = document.getElementById("close-modal-x");
    if (bg) {
      bg.addEventListener("click", (e) => {
        if (e.target === bg) this.closeModal();
      });
    }
    if (closeX) {
      closeX.addEventListener("click", () => this.closeModal());
    }
  }

  closeModal() {
    if (this.fairModalMap) {
      try { this.fairModalMap.remove(); } catch (e) {}
      this.fairModalMap = null;
    }
    this.modalRoot.innerHTML = "";
  }
}

function initZafraApp() {
  try {
    if (!(window.app instanceof App)) {
      window.app = new App();
    }
  } catch (err) {
    console.error("Error al inicializar Zafra:", err);
    const appEl = document.getElementById("app");
    if (appEl) {
      appEl.innerHTML = `
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #081711; color: #ffffff; font-family: 'Outfit', sans-serif; text-align: center; padding: 24px;">
          <div style="max-width: 440px; background: #0d1e16; border: 1px solid #1f3d2e; border-radius: 12px; padding: 32px 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.5);">
            <div style="width: 52px; height: 52px; border-radius: 14px; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.35); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: #22c55e;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <h2 style="font-size: 1.3rem; font-weight: 700; margin: 0 0 10px; color: #ffffff;">Actualización del Sistema Zafra</h2>
            <p style="font-size: 0.88rem; color: #94a3b8; line-height: 1.5; margin-bottom: 22px;">
              Se ha detectado una versión previa en la caché del navegador. Haz clic en el botón para sincronizar con los últimos datos de la red de Morelos.
            </p>
            <button id="btn-emergency-reset" style="background: #22c55e; color: #052e16; font-weight: 700; border: none; border-radius: 8px; padding: 12px 20px; font-size: 0.92rem; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);">
              Sincronizar y Cargar Zafra
            </button>
          </div>
        </div>
      `;
      const btn = document.getElementById("btn-emergency-reset");
      if (btn) {
        btn.addEventListener("click", () => {
          try {
            localStorage.clear();
          } catch(e) {}
          window.location.reload();
        });
      }
    }
  }
}

// Inicializar de inmediato y respaldar con DOMContentLoaded
initZafraApp();
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initZafraApp);
}

  </script>
</body>
</html>
