  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">' +
    '<rect width="400" height="300" fill="' + c[0] + '"/>' +
    '<circle cx="330" cy="40" r="90" fill="' + c[1] + '" opacity="0.08"/>' +
    '<circle cx="50" cy="270" r="110" fill="' + c[1] + '" opacity="0.07"/>' +
    '<text x="200" y="185" font-size="120" text-anchor="middle">' + emoji + '</text></svg>';
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

function zafraSlug(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function buildZafraCatalog() {
  const prods = Object.fromEntries(INITIAL_PRODUCERS.map(p => [p.id, p]));
  const out = [];
  let n = 0;
  ZAFRA_CATEGORIES.forEach(cat => {
    (ZAFRA_CATALOG_SPEC[cat] || []).forEach(row => {
      const [emoji, name, pid, price, unit, availability, tags, delivery] = row;
      const pr = prods[pid];
      n++;
      const photo = ZAFRA_REAL_PHOTOS[name];
      const imgPath = photo ? "assets/img/" + photo + ".jpg" : "assets/img/products/" + zafraSlug(name) + ".jpg";
      out.push({
        id: "z-" + n,
        name: name,
        producerId: pid,
        producerName: pr.name,
        municipality: pr.municipality,
        price: price,
        unit: unit,
        image: imgPath,
        fallbackImage: zafraPlaceholder(emoji, cat),
        isPreventa: /pedido/i.test(availability),
        harvestDate: availability,
        availability: availability,
        delivery: delivery,
        stock: 20 + ((n * 7) % 60),
        category: cat,
        tags: tags,
        description: name + " de " + pr.ranchName + ", " + pr.municipality + ". Directo del productor."
      });
    });
  });
  return out;
}

// Store Wrapper con tolerancia a fallos
class DataStore {
  constructor() {
    this.init();
  }

  init() {
    try {
      const DATA_VERSION = "zafra_v6_fotos_productos";
      if (localStorage.getItem("rm_zafra_version") !== DATA_VERSION) {
        localStorage.setItem("rm_zafra_routes", JSON.stringify(INITIAL_ZAFRA_ROUTES));
        localStorage.setItem("rm_map_municipalities", JSON.stringify(INITIAL_MAP_MUNICIPALITIES));
        localStorage.setItem("rm_zafra_fairs", JSON.stringify(INITIAL_ZAFRA_FAIRS));
        localStorage.setItem("rm_regions", JSON.stringify(INITIAL_ZAFRA_ROUTES));
        localStorage.setItem("rm_producers", JSON.stringify(INITIAL_PRODUCERS));
        localStorage.setItem("rm_products", JSON.stringify(INITIAL_PRODUCTS));
        localStorage.setItem("rm_events", JSON.stringify(INITIAL_EVENTS));
        localStorage.setItem("rm_youth", JSON.stringify(INITIAL_YOUTH_ROUTES));
        localStorage.setItem("rm_admin_kpis", JSON.stringify(INITIAL_ADMIN_KPIS));
        localStorage.setItem("rm_user_profile", JSON.stringify(INITIAL_USER_PROFILE));
        localStorage.setItem("rm_zafra_version", DATA_VERSION);
      }

      if (!localStorage.getItem("rm_producers")) {
        localStorage.setItem("rm_producers", JSON.stringify(INITIAL_PRODUCERS));
      }
      if (!localStorage.getItem("rm_products")) {
        localStorage.setItem("rm_products", JSON.stringify(INITIAL_PRODUCTS));
      }
      if (!localStorage.getItem("rm_events")) {
        localStorage.setItem("rm_events", JSON.stringify(INITIAL_EVENTS));
      }
      if (!localStorage.getItem("rm_youth")) {
        localStorage.setItem("rm_youth", JSON.stringify(INITIAL_YOUTH_ROUTES));
      }
      if (!localStorage.getItem("rm_admin_kpis")) {
        localStorage.setItem("rm_admin_kpis", JSON.stringify(INITIAL_ADMIN_KPIS));
      }
      if (!localStorage.getItem("rm_cart")) {
        localStorage.setItem("rm_cart", JSON.stringify([]));
      }
      if (!localStorage.getItem("rm_consumer_orders")) {
        localStorage.setItem("rm_consumer_orders", JSON.stringify(INITIAL_ORDERS));
      }
      if (!localStorage.getItem("rm_chat")) {
        localStorage.setItem("rm_chat", JSON.stringify(INITIAL_CHAT));
      }
      if (!localStorage.getItem("rm_user_profile")) {
        localStorage.setItem("rm_user_profile", JSON.stringify(INITIAL_USER_PROFILE));
      }
    } catch (e) {
      console.warn("Storage warning in DataStore init:", e);
    }
  }

  getProducers() {
    try {
      const data = localStorage.getItem("rm_producers");
      const parsed = data ? JSON.parse(data) : null;
      return Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_PRODUCERS;
    } catch (e) {
      return INITIAL_PRODUCERS;
    }
  }

  saveProducers(data) {
    try {
      localStorage.setItem("rm_producers", JSON.stringify(data));
    } catch (e) {}
  }

  getProducts() {
    try {
      const data = localStorage.getItem("rm_products");
      const parsed = data ? JSON.parse(data) : null;
      return Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_PRODUCTS;
    } catch (e) {
      return INITIAL_PRODUCTS;
    }
  }

  saveProducts(data) {
    try {
      localStorage.setItem("rm_products", JSON.stringify(data));
    } catch (e) {}
  }

  getEvents() {
    try {
      const data = localStorage.getItem("rm_events");
      const parsed = data ? JSON.parse(data) : null;
      if (!Array.isArray(parsed) || parsed.length === 0) return INITIAL_EVENTS;
      const byId = new Map(parsed.map(ev => [ev.id, ev]));
      return INITIAL_EVENTS.map(base => byId.has(base.id) ? { ...base, ...byId.get(base.id), lat: base.lat, lng: base.lng, workshops: base.workshops, address: base.address, schedule: base.schedule } : base);
    } catch (e) {
      return INITIAL_EVENTS;
    }
  }

  saveEvents(data) {
    try {
      localStorage.setItem("rm_events", JSON.stringify(data));
    } catch (e) {}
  }

  getRegions() {
    return this.getZafraRoutes();
  }

  getZafraRoutes() {
    try {
      const data = localStorage.getItem("rm_zafra_routes");
      const parsed = data ? JSON.parse(data) : null;
      return Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_ZAFRA_ROUTES;
    } catch (e) {
      return INITIAL_ZAFRA_ROUTES;
    }
  }

  getMapMunicipalities() {
    try {
      const data = localStorage.getItem("rm_map_municipalities");
      const parsed = data ? JSON.parse(data) : null;
      return Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_MAP_MUNICIPALITIES;
    } catch (e) {
      return INITIAL_MAP_MUNICIPALITIES;
    }
  }

  getZafraFairs() {
    try {
      const data = localStorage.getItem("rm_zafra_fairs");
      const parsed = data ? JSON.parse(data) : null;
      if (!Array.isArray(parsed) || parsed.length === 0) return INITIAL_ZAFRA_FAIRS;
      const byId = new Map(parsed.map(f => [f.id, f]));
      return INITIAL_ZAFRA_FAIRS.map(base => byId.has(base.id) ? { ...base, ...byId.get(base.id), lat: base.lat, lng: base.lng, workshops: base.workshops, address: base.address, schedule: base.schedule, municipality: base.municipality, organizer: base.organizer, costLabel: base.costLabel } : base);
    } catch (e) {
      return INITIAL_ZAFRA_FAIRS;
    }
  }

  getFairVisits() {
    try {
      const data = localStorage.getItem("rm_fair_visits");
      const parsed = data ? JSON.parse(data) : null;
      return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  saveFairVisit(itemId, visitInfo) {
    const visits = this.getFairVisits();
    visits[itemId] = visitInfo;
    try {
      localStorage.setItem("rm_fair_visits", JSON.stringify(visits));
    } catch (e) {}
    return visits;
  }

  removeFairVisit(itemId) {
    const visits = this.getFairVisits();
    delete visits[itemId];
    try {
      localStorage.setItem("rm_fair_visits", JSON.stringify(visits));
    } catch (e) {}
    return visits;
  }

  getYouth() {
    try {
      const data = localStorage.getItem("rm_youth");
      const parsed = data ? JSON.parse(data) : null;
      return Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_YOUTH_ROUTES;
    } catch (e) {
      return INITIAL_YOUTH_ROUTES;
    }
  }

  saveYouth(data) {
    try {
      localStorage.setItem("rm_youth", JSON.stringify(data));
    } catch (e) {}
  }

  getAdminKPIs() {
    try {
      const data = localStorage.getItem("rm_admin_kpis");
      const parsed = data ? JSON.parse(data) : null;
      return parsed && typeof parsed === "object" ? parsed : INITIAL_ADMIN_KPIS;
    } catch (e) {
      return INITIAL_ADMIN_KPIS;
    }
  }

  saveAdminKPIs(data) {
    try {
      localStorage.setItem("rm_admin_kpis", JSON.stringify(data));
    } catch (e) {}
  }

  getCart() {
    try {
      const data = localStorage.getItem("rm_cart");
      const parsed = data ? JSON.parse(data) : null;
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  saveCart(data) {
    try {
      localStorage.setItem("rm_cart", JSON.stringify(data));
    } catch (e) {}
    window.dispatchEvent(new CustomEvent("cart-updated", { detail: data }));
  }

  addToCart(productId, qty = 1) {
    const products = this.getProducts();
    const product = products.find(p => p.id === productId);
    if (!product || product.paused) return false;

    let cart = this.getCart();
    const existing = cart.find(item => item.id === productId);
    if (existing) {
      existing.qty += qty;
    } else {
      cart.push({
        id: product.id,
        name: product.name,
        price: product.price,
        unit: product.unit,
        image: product.image,
        producerName: product.producerName,
        producerId: product.producerId,
        municipality: product.municipality,
        isPreventa: product.isPreventa,
        harvestDate: product.harvestDate,
        qty: qty
      });
    }
    this.saveCart(cart);
    return true;
  }

  updateCartQty(productId, qty) {
    let cart = this.getCart();
    if (qty <= 0) {
      cart = cart.filter(item => item.id !== productId);
    } else {
      const item = cart.find(i => i.id === productId);
      if (item) item.qty = qty;
    }
    this.saveCart(cart);
  }

  clearCart() {
    this.saveCart([]);
  }

  getConsumerOrders() {
    try {
      const data = localStorage.getItem("rm_consumer_orders");
      const parsed = data ? JSON.parse(data) : null;
      return Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_ORDERS;
    } catch (e) {
      return INITIAL_ORDERS;
    }
  }

  saveConsumerOrders(orders) {
    try {
      localStorage.setItem("rm_consumer_orders", JSON.stringify(orders));
    } catch (e) {}
  }

  getChat() {
    try {
      const data = localStorage.getItem("rm_chat");
      const parsed = data ? JSON.parse(data) : null;
      return Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_CHAT;
    } catch (e) {
      return INITIAL_CHAT;
    }
  }

  addChatMessage(sender, role, text) {
    const chat = this.getChat();
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    chat.push({ id: Date.now(), sender, role, text, time });
    try {
      localStorage.setItem("rm_chat", JSON.stringify(chat));
    } catch (e) {}
    window.dispatchEvent(new CustomEvent("chat-updated", { detail: chat }));
  }

  getUserProfile() {
    try {
      const data = localStorage.getItem("rm_user_profile");
      const parsed = data ? JSON.parse(data) : null;
      return parsed && typeof parsed === "object" ? parsed : INITIAL_USER_PROFILE;
    } catch (e) {
      return INITIAL_USER_PROFILE;
    }
  }

  saveUserProfile(profile) {
    try {
      localStorage.setItem("rm_user_profile", JSON.stringify(profile));
    } catch (e) {}
  }
}

const store = new DataStore();
window.store = store;

class App {
  constructor() {
    try {
      this.currentRole = localStorage.getItem("rm_current_role") || "consumidor";
    } catch (e) {
      this.currentRole = "consumidor";
    }
    this.consumerTab = "inicio";
    this.selectedMunicipality = "todos";
    this.selectedCategory = "todos";
    this.searchQuery = "";
    this.selectedRegionId = "cuautla";
    this.selectedRouteId = "all";
    this.leafletMap = null;
    this.markersLayer = null;
    this.routeLineLayer = null;
    this.navHistory = [];
    this.activeProducerId = "prod-1";
    this.producerLotFilter = "todos";
    this.catalogFiltersOpen = false;

    try {
      const initialHash = window.location.hash.replace("#", "");
      if (["inicio", "catalogo", "mapa", "ferias", "pedidos", "perfil"].includes(initialHash)) {
        this.currentRole = "consumidor";
        this.consumerTab = initialHash;
      } else if (["productor", "joven", "admin"].includes(initialHash)) {
        this.currentRole = initialHash;
      }
      if (window.history && typeof window.history.replaceState === "function") {
        window.history.replaceState(this.getNavSnapshot(), "", this.getHashForSnapshot());
      }
    } catch (e) {}
    this.currentTileStyle = "topo";
    this.currentTileLayer = null;
    this.isMapFullscreen = false;
    this.feriasFilter = "todos";
    this.fairModalMap = null;

    this.initElements();
    this.bindEvents();
    this.render();

    if (this.currentRole === "consumidor" && this.consumerTab === "mapa") {
      setTimeout(() => this.setupLeafletMap(), 100);
    }
  }

  initElements() {
    this.appEl = document.getElementById("app");
    this.modalRoot = document.getElementById("modal-root");
    this.toastRoot = document.getElementById("toast-root");
    this.offlineBanner = document.getElementById("offline-banner");
  }

  bindEvents() {
    window.addEventListener("online", () => this.updateOnlineStatus());
    window.addEventListener("offline", () => this.updateOnlineStatus());
    this.updateOnlineStatus();

    window.addEventListener("cart-updated", () => this.updateCartBadge());
    window.addEventListener("chat-updated", () => {
      const chatMessages = document.querySelector(".chat-messages");
      if (chatMessages) {
        this.renderChatMessages(chatMessages);
      }
    });

    window.addEventListener("popstate", (e) => {
      if (e.state && e.state.role && e.state.tab) {
        const last = this.navHistory[this.navHistory.length - 1];
        if (last && this.snapshotsEqual(last, e.state)) {
          this.navHistory.pop();
        }
        this.applyNavSnapshot(e.state, false);
        return;
      }
      const hash = window.location.hash.replace("#", "");
      if (["inicio", "catalogo", "mapa", "ferias", "pedidos", "perfil"].includes(hash)) {
        if (this.currentRole !== "consumidor" || this.consumerTab !== hash) {
          this.applyNavSnapshot({ ...this.getNavSnapshot(), role: "consumidor", tab: hash }, false);
        }
      } else if (["productor", "joven", "admin"].includes(hash)) {
        if (this.currentRole !== hash) {
          this.applyNavSnapshot({ ...this.getNavSnapshot(), role: hash }, false);
        }
      }
    });

    window.addEventListener("hashchange", () => {
      const hash = window.location.hash.replace("#", "");
      if (["inicio", "catalogo", "mapa", "ferias", "pedidos", "perfil"].includes(hash)) {
        if (this.currentRole !== "consumidor" || this.consumerTab !== hash) {
          this.setConsumerTab(hash, false, false);
        }
      } else if (["productor", "joven", "admin"].includes(hash)) {
        if (this.currentRole !== hash) {
          this.setRole(hash, false);
        }
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (this.isMapFullscreen) {
          this.toggleMapFullscreen(false);
        } else if (this.modalRoot && this.modalRoot.innerHTML) {
          this.closeModal();
        }
      }
    });
  }

  getNavSnapshot() {
    return {
      role: this.currentRole,
      tab: this.consumerTab,
      routeId: this.selectedRouteId,
      municipality: this.selectedMunicipality,
      category: this.selectedCategory
    };
  }

  getHashForSnapshot(snap = this.getNavSnapshot()) {
    return snap.role === "consumidor" ? `#${snap.tab}` : `#${snap.role}`;
  }

  snapshotsEqual(a, b) {
    return Boolean(
      a && b &&
      a.role === b.role &&
      a.tab === b.tab &&
      a.routeId === b.routeId &&
      a.municipality === b.municipality &&
      a.category === b.category
    );
  }

  getSnapshotLabel(snap) {
    if (!snap) return "Inicio";
    if (snap.role !== "consumidor") return this.getRoleLabel(snap.role);
    switch (snap.tab) {
      case "inicio": return "Inicio";
      case "catalogo":
        return snap.municipality && snap.municipality !== "todos"
          ? `Catálogo · ${snap.municipality}`
          : "Catálogo";
      case "mapa":
        return snap.routeId && snap.routeId !== "all" ? "Mapa (ruta)" : "Mapa";
      case "ferias": return "Ferias";
      case "pedidos": return "Mis pedidos";
      case "perfil": return "Mi entrega";
      default: return "Inicio";
    }
  }

  getBackTargetLabel() {
    if (this.isMapFullscreen) return "Salir de pantalla completa";
    if (this.navHistory.length > 0) {
      const last = this.navHistory[this.navHistory.length - 1];
      if (
        last.role === "consumidor" && last.tab === "mapa" &&
        this.currentRole === "consumidor" && this.consumerTab === "mapa" &&
        last.routeId === "all" && this.selectedRouteId !== "all"
      ) {
        return "Todas las rutas";
      }
      return this.getSnapshotLabel(last);
    }
    if (this.currentRole === "consumidor" && this.consumerTab === "mapa" && this.selectedRouteId !== "all") {
      return "Todas las rutas";
    }
    if (this.currentRole === "consumidor" && this.consumerTab === "catalogo" && (this.selectedMunicipality !== "todos" || this.selectedCategory !== "todos")) {
      return "Todo el catálogo";
    }
    if (this.currentRole !== "consumidor" || this.consumerTab !== "inicio") {
      return "Inicio";
    }
    return "";
  }

  recordNavTransition(prevSnap) {
    const nextSnap = this.getNavSnapshot();
    if (this.snapshotsEqual(prevSnap, nextSnap)) return;
    this.navHistory.push(prevSnap);
    if (this.navHistory.length > 30) {
      this.navHistory.shift();
    }
    try {
      if (window.history && typeof window.history.pushState === "function") {
        window.history.pushState(nextSnap, "", this.getHashForSnapshot(nextSnap));
      }
    } catch (e) {}
  }

  applyNavSnapshot(snap, syncHashReplace = true) {
    if (!snap) return;
    this.currentRole = snap.role || "consumidor";
    this.consumerTab = snap.tab || "inicio";
    this.selectedRouteId = snap.routeId || "all";
    this.selectedMunicipality = snap.municipality || "todos";
    this.selectedCategory = snap.category || "todos";
    this.isMapFullscreen = false;
    try {
      document.body.style.overflow = "";
      localStorage.setItem("rm_current_role", this.currentRole);
    } catch (e) {}
    if (syncHashReplace) {
      try {
        const hash = this.getHashForSnapshot();
        if (window.history && typeof window.history.replaceState === "function") {
          window.history.replaceState(this.getNavSnapshot(), "", hash);
        } else if (window.location.hash !== hash) {
          window.location.hash = hash.slice(1);
        }
      } catch (e) {}
    }
    this.render();
    if (this.currentRole === "consumidor" && this.consumerTab === "mapa") {
      setTimeout(() => this.setupLeafletMap(), 60);
    }
  }

  goBack() {
    if (this.isMapFullscreen) {
      this.toggleMapFullscreen(false);
      return;
    }
    if (this.navHistory.length > 0) {
      const prev = this.navHistory.pop();
      this.applyNavSnapshot(prev, true);
      return;
    }
    if (this.currentRole === "consumidor" && this.consumerTab === "mapa" && this.selectedRouteId !== "all") {
      this.selectMapRoute("all", false);
      return;
    }
    if (this.currentRole === "consumidor" && this.consumerTab === "catalogo" && (this.selectedMunicipality !== "todos" || this.selectedCategory !== "todos")) {
      this.selectedMunicipality = "todos";
      this.selectedCategory = "todos";
      this.searchQuery = "";
      this.applyNavSnapshot(this.getNavSnapshot(), true);
      return;
    }
    if (this.currentRole !== "consumidor" || this.consumerTab !== "inicio") {
      this.currentRole = "consumidor";
      this.consumerTab = "inicio";
      this.applyNavSnapshot(this.getNavSnapshot(), true);
    }
  }

  selectMapRoute(routeId, pushNav = true) {
    const prevSnap = this.getNavSnapshot();
    this.selectedRouteId = routeId;
    if (pushNav) {
      this.recordNavTransition(prevSnap);
    }
    this.appEl.querySelectorAll("#map-route-selector [data-route-id]").forEach(b => {
      b.classList.toggle("active", b.dataset.routeId === this.selectedRouteId);
    });
    const routes = store.getZafraRoutes();
    const activeRoute = this.selectedRouteId === "all" ? null : routes.find(r => r.id === this.selectedRouteId);
    const bannerContainer = document.getElementById("route-detail-banner-container");
    if (bannerContainer) {
      bannerContainer.innerHTML = this.renderRouteDetailBanner(activeRoute);
    }
    this.updateBackBar();
    if (this.leafletMap) {
      this.renderMapEntities();
      this.leafletMap.invalidateSize();
    } else {
      this.setupLeafletMap();
    }
  }

  toggleMapFullscreen(forceState) {
    const wrapper = document.getElementById("map-canvas-wrapper");
    if (!wrapper) return;
    this.isMapFullscreen = typeof forceState === "boolean" ? forceState : !this.isMapFullscreen;
    wrapper.classList.toggle("is-fullscreen", this.isMapFullscreen);
    document.body.style.overflow = this.isMapFullscreen ? "hidden" : "";
    if (this.leafletMap) {
      setTimeout(() => this.leafletMap.invalidateSize(), 150);
    }
  }

  renderBackBar() {
    if (this.currentRole === "consumidor" && this.consumerTab === "inicio") {
      return "";
    }
    const targetLabel = this.getBackTargetLabel();
    return `
      <div class="back-nav-bar">
        <button type="button" class="btn-back-nav" id="app-back-btn" aria-label="Regresar atrás">
          ${Icons.arrowLeft}
          <span>Regresar</span>
          ${targetLabel ? `<small class="back-nav-hint">· ${targetLabel}</small>` : ""}
        </button>
      </div>
    `;
  }

  updateBackBar() {
    const container = document.getElementById("back-nav-container");
    if (!container) return;
    container.innerHTML = this.renderBackBar();
    this.bindBackBarEvents();
  }

  bindBackBarEvents() {
    const backBtn = document.getElementById("app-back-btn");
    if (backBtn) {
      backBtn.addEventListener("click", () => this.goBack());
    }
  }

  updateOnlineStatus() {
    if (!this.offlineBanner) return;
    if (!navigator.onLine) {
      this.offlineBanner.hidden = false;
      this.offlineBanner.classList.add("active");
      this.offlineBanner.style.setProperty("display", "flex", "important");
      this.offlineBanner.innerHTML = `${Icons.shield} Modo local activo · Los registros se sincronizarán al restablecer la red institucional.`;
    } else {
      this.offlineBanner.hidden = true;
      this.offlineBanner.classList.remove("active");
      this.offlineBanner.style.setProperty("display", "none", "important");
    }
  }

  setRole(role, pushNav = true) {
    const prevSnap = this.getNavSnapshot();
    this.currentRole = role;
    this.isMapFullscreen = false;
    try { document.body.style.overflow = ""; } catch (e) {}
    localStorage.setItem("rm_current_role", role);
    if (pushNav) {
      this.recordNavTransition(prevSnap);
    }
    this.showToast(`Vista operacional activa: ${this.getRoleLabel(role)}`, "info");
    this.render();
    if (this.currentRole === "consumidor" && this.consumerTab === "mapa") {
      setTimeout(() => this.setupLeafletMap(), 60);
    }
  }

  getRoleLabel(role) {
    switch (role) {
      case "consumidor": return "Consumidor Final";
      case "productor": return "Productor Agrícola";
      case "joven": return "Servicio Social Universitario";
      case "admin": return "Administración Operativa";
      default: return role;
    }
  }

  setConsumerTab(tab, updateHash = true, pushNav = true) {
    const prevSnap = this.getNavSnapshot();
    this.currentRole = "consumidor";
    this.consumerTab = tab;
    this.isMapFullscreen = false;
    try { document.body.style.overflow = ""; } catch (e) {}
    if (pushNav) {
      this.recordNavTransition(prevSnap);
    } else if (updateHash && window.location.hash !== `#${tab}`) {
      try { window.location.hash = tab; } catch (e) {}
    }
    this.render();
    if (tab === "mapa") {
      setTimeout(() => this.setupLeafletMap(), 60);
    }
  }

  filterCatalogByMuni(muniName) {
    const prevSnap = this.getNavSnapshot();
    this.currentRole = "consumidor";
    this.selectedMunicipality = muniName;
    this.selectedCategory = "todos";
    this.consumerTab = "catalogo";
    this.recordNavTransition(prevSnap);
    this.render();
    this.showToast(`Filtrando cosechas de ${muniName}`, "info");
  }

  showToast(message, type = "success") {
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <span>${Icons.check}</span>
      <span>${message}</span>
    `;
    this.toastRoot.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = "0";
      toast.style.transform = "translateX(16px)";
      toast.style.transition = "all 0.2s ease";
      setTimeout(() => toast.remove(), 250);
    }, 2800);
  }

  normalizeText(str) {
    return String(str || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "");
  }

  getCatalogState() {
    const products = store.getProducts().filter(p => !p.paused);
    const municipalities = [...new Set(products.map(p => p.municipality))].sort();
    const muniCounts = {};
    const catCounts = {};
    products.forEach(p => {
      muniCounts[p.municipality] = (muniCounts[p.municipality] || 0) + 1;
      catCounts[p.category] = (catCounts[p.category] || 0) + 1;
    });

    const queryNorm = this.normalizeText(this.searchQuery.trim());
    const filtered = products.filter(p => {
      const matchMuni = this.selectedMunicipality === "todos" || p.municipality === this.selectedMunicipality;
      const matchCat = this.selectedCategory === "todos" || p.category === this.selectedCategory;
      const matchSearch = !queryNorm ||
        this.normalizeText(p.name).includes(queryNorm) ||
        this.normalizeText(p.producerName).includes(queryNorm) ||
        this.normalizeText(p.municipality).includes(queryNorm) ||
        this.normalizeText(p.category).includes(queryNorm);
      return matchMuni && matchCat && matchSearch;
    });

    return { products, municipalities, muniCounts, catCounts, filtered };
  }

      pills.push(`

          <span>Categoría: <strong>${this.escapeHtml(this.selectedCategory)}</strong></span>
          <span aria-hidden="true">&times;</span>

    if (this.searchQuery && this.searchQuery.trim()) {
      pills.push(`

    return `

  renderCatalogResultsHtml(filtered) {

      return `

          <button type="button" class="btn btn-secondary btn-sm" id="reset-filters-btn-empty">Mostrar todo el catálogo</button>
        </div>
      `;
    }
    if (this.selectedCategory === "todos") {
      return ZAFRA_CATEGORIES.map((c, i) => {
        const items = filtered.filter(p => p.category === c);
        return items.length ? `
          <section class="catalog-section">
            <h3 class="catalog-section-title"><span>${String.fromCharCode(65 + i)}</span>${c}<small>${items.length} productos</small></h3>
            <div class="catalog-grid">${items.map(p => this.renderProductCard(p)).join("")}</div>
          </section>` : "";
      }).join("");
    }
    const catIdx = ZAFRA_CATEGORIES.indexOf(this.selectedCategory);
    const letter = catIdx >= 0 ? String.fromCharCode(65 + catIdx) : "•";
    return `
      <section class="catalog-section">
        <h3 class="catalog-section-title"><span>${letter}</span>${this.escapeHtml(this.selectedCategory)}<small>${filtered.length} productos</small></h3>
        <div class="catalog-grid">${filtered.map(p => this.renderProductCard(p)).join("")}</div>
      </section>
    `;
  }

  // FERIAS & TALLERES DE ZAFRA (UBICACIÓN EN MAPA EMERGENTE + CONFIRMACIÓN)

  getAllFairsAndWorkshops() {
    const events = store.getEvents().map((ev, idx) => ({
      ...ev,
      kind: ev.type === "feria" ? "feria" : "taller",
      displayName: ev.title,
      shortType: ev.typeLabel || (ev.type === "taller" ? "Taller Práctico" : ev.type === "campamento" ? "Campamento" : "Feria Regional"),
      whatItIs: ev.description,
      organizer: ev.instructor || "Red Zafra Morelos",
      costLabel: ev.price && Number(ev.price) > 0 ? `$${ev.price} MXN` : "Entrada Libre",
      badgeOrder: `Actividad ${idx + 1}`
    }));

    const fairs = store.getZafraFairs().map((f, idx) => ({
      ...f,
      kind: "feria",
      displayName: f.name,
      shortType: f.type,
      whatItIs: f.focus,
      organizer: f.organizer || "Productores y Jóvenes Zafra",
      costLabel: f.costLabel || "Entrada Libre",
      badgeOrder: `Feria ${idx + 1}`
    }));

    return { events, fairs, all: [...events, ...fairs] };
  }

  setupLeafletMap() {
    const mapEl = document.getElementById("zafra-leaflet-map");
    if (!mapEl) return;

    if (typeof L === "undefined") {
      mapEl.innerHTML = `
        <div style="color: var(--text-muted); padding: 40px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
          <div style="font-weight: 600; font-size: 1rem; margin-bottom: 8px; color: var(--text-main);">Cargando mapa topográfico de Morelos...</div>
          <div style="font-size: 0.8rem; color: var(--text-muted);">Obteniendo relieve, rutas y sedes de la red Zafra.</div>
        </div>
      `;
      setTimeout(() => this.setupLeafletMap(), 250);
      return;
    }

    if (this.leafletMap) {
      try {
        this.leafletMap.remove();
      } catch (e) {}
      this.leafletMap = null;
    }

    this.leafletMap = L.map("zafra-leaflet-map", {
      zoomControl: true,
      attributionControl: false
    }).setView([18.80, -99.02], 10);

    this.setMapTileLayer("topo");

    this.markersLayer = L.layerGroup().addTo(this.leafletMap);
    this.routeLineLayer = L.layerGroup().addTo(this.leafletMap);

    this.renderMapEntities();

    this.leafletMap.whenReady(() => {
      this.leafletMap.invalidateSize();
    });
    setTimeout(() => {
      if (this.leafletMap) this.leafletMap.invalidateSize();
    }, 120);
    setTimeout(() => {
      if (this.leafletMap) this.leafletMap.invalidateSize();
    }, 450);
  }

  setMapTileLayer(styleName = "topo") {
    if (!this.leafletMap) return;
    this.currentTileStyle = styleName;

    if (this.currentTileLayer) {
      this.leafletMap.removeLayer(this.currentTileLayer);
      this.currentTileLayer = null;
    }

    if (styleName === "osm") {
      this.currentTileLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "OpenStreetMap"
      });
    } else {
      this.currentTileLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 18,
        attribution: "Esri World Topo Map"
      });
      this.currentTileLayer.on("tileerror", () => {
        if (this.currentTileStyle !== "osm") {
          this.setMapTileLayer("osm");
        }
      });
    }

    this.currentTileLayer.addTo(this.leafletMap);
  }

  renderMapEntities() {
    if (!this.leafletMap || !this.markersLayer || !this.routeLineLayer) return;

    this.markersLayer.clearLayers();
    this.routeLineLayer.clearLayers();

    const municipalities = store.getMapMunicipalities();
    const routes = store.getZafraRoutes();
    const activeRoute = this.selectedRouteId === "all" ? null : routes.find(r => r.id === this.selectedRouteId);

    municipalities.forEach(m => {
      const mRoutes = routes.filter(r => m.routeIds.includes(r.id));
      const isIncluded = !activeRoute || m.routeIds.includes(this.selectedRouteId);
      const focusRoute = activeRoute && isIncluded ? activeRoute : mRoutes[0];
      const dotColor = focusRoute ? focusRoute.color : "#2f5d3a";

      const workshops = [...new Set(mRoutes.flatMap(r => r.workshops))];
      const routeShort = mRoutes.map(r => r.shortName).join(" · ");
      const shortProducts = m.productsSummary.replace(/\.$/, "");
      const labelSub = activeRoute && isIncluded
        ? `${shortProducts} · Talleres: ${activeRoute.workshops.slice(0, 2).join(", ")}`
        : `${shortProducts} · ${routeShort}`;

      const customIcon = L.divIcon({
        className: "zafra-marker-wrapper",
        html: `
          <div class="zafra-map-marker ${isIncluded ? 'active' : 'muted'}" data-muni="${m.name}">
            <div class="marker-top">
              <span class="marker-dot" style="background: ${dotColor};"></span>
              <span class="marker-name">${m.name}</span>
              <span class="star-score">★ ${m.rating.toFixed(1)}</span>
            </div>
            <div class="marker-sub">${labelSub}</div>
          </div>
        `,
        iconSize: null,
        iconAnchor: [55, 18]
      });

      const marker = L.marker([m.lat, m.lng], { icon: customIcon }).addTo(this.markersLayer);

      marker.bindTooltip(`
        <div class="zafra-map-tooltip">
          <strong>${m.name}</strong> · ${routeShort}<br/>
          <span><b>Qué hay:</b> ${m.productsSummary}</span><br/>
          <span><b>Talleres:</b> ${workshops.slice(0, 3).join(", ")}</span>
        </div>
      `, { direction: "top", offset: [0, -14] });

      marker.bindPopup(`
        <div class="zafra-map-popup">
          <div class="zafra-popup-title">${m.name} <span class="zafra-popup-score">★ ${m.rating.toFixed(1)}</span></div>
          <div class="zafra-popup-routes">
            ${mRoutes.map(r => `<span class="zafra-popup-route-tag" style="border-left: 3px solid ${r.color};">${r.name}</span>`).join("")}
          </div>
          <div class="zafra-popup-block">
            <div class="zafra-popup-label">Qué hay en esta región</div>
            <p>${m.productsSummary}</p>
          </div>
          <div class="zafra-popup-block">
            <div class="zafra-popup-label">Talleres en esta ruta</div>
            <p>${workshops.join(" · ")}</p>
          </div>
          <button class="btn btn-primary btn-sm" onclick="window.app.filterCatalogByMuni('${m.name}')" style="width: 100%; font-size: 12px; padding: 6px 10px;">
            Ver productos de ${m.name}
          </button>
        </div>
      `);
    });

    if (activeRoute) {
      const routeMunis = municipalities.filter(m => m.routeIds.includes(this.selectedRouteId));
      if (routeMunis.length > 1) {
        const coords = routeMunis.map(m => [m.lat, m.lng]);
        L.polyline(coords, {
          color: activeRoute.color,
          weight: 4,
          opacity: 0.9,
          dashArray: "6, 8"
        }).addTo(this.routeLineLayer);

        this.leafletMap.fitBounds(coords, { padding: [45, 45], maxZoom: 12 });
      }
    } else {
      this.leafletMap.setView([18.80, -99.02], 10);
    }
  }

  escapeHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  getActiveProducer() {
    const producers = store.getProducers();
    return producers.find(p => p.id === this.activeProducerId) || producers[0];
  }

  // ==========================================================================
  // EVENT BINDINGS
  // ==========================================================================
  bindCatalogCardEvents(scopeEl = this.appEl) {
    if (!scopeEl) return;
    scopeEl.querySelectorAll("[data-add-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = btn.dataset.addId;
        if (store.addToCart(id, 1)) {
          this.showToast("Lote agregado a la canasta", "success");
        } else {
          this.showToast("Este lote está pausado temporalmente", "info");
        }
      });
    });

    scopeEl.querySelectorAll("[data-producer-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        this.openProducerModal(btn.dataset.producerId);
      });
    });

    const emptyReset = scopeEl.querySelector("#reset-filters-btn-empty");
    if (emptyReset) {
      emptyReset.addEventListener("click", () => {
        this.selectedMunicipality = "todos";
        this.selectedCategory = "todos";
        this.searchQuery = "";
        this.updateCatalogResults();
      });
    }
  }

  bindCatalogActivePillEvents() {
    const activeWrap = document.getElementById("catalog-active-pills");
    if (!activeWrap) return;
    activeWrap.querySelectorAll("[data-clear-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.clearFilter;
        if (key === "muni") this.selectedMunicipality = "todos";
        if (key === "cat") this.selectedCategory = "todos";
        if (key === "search") this.searchQuery = "";
        this.updateCatalogResults();
      });
    });
    const resetBtn = activeWrap.querySelector("#reset-filters-btn");
    if (resetBtn) {
      resetBtn.addEventListener("click", () => {
        this.selectedMunicipality = "todos";
        this.selectedCategory = "todos";
        this.searchQuery = "";
        this.updateCatalogResults();
      });
    }
  }

  updateCatalogResults() {
    const { filtered } = this.getCatalogState();
    const resultsEl = document.getElementById("catalog-results-container");
    if (resultsEl) {
      resultsEl.innerHTML = this.renderCatalogResultsHtml(filtered);
      this.bindCatalogCardEvents(resultsEl);
    }

    const countEl = document.getElementById("catalog-count-label");
    if (countEl) {
      countEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'producto disponible' : 'productos disponibles'}`;
    }

    const searchInput = document.getElementById("catalog-search-input");
    if (searchInput && searchInput.value !== this.searchQuery) {
      searchInput.value = this.searchQuery;
    }

    const clearSearchBtn = document.getElementById("catalog-clear-search");
    if (clearSearchBtn) {
      clearSearchBtn.style.display = this.searchQuery ? "inline-flex" : "none";
    }

    const muniSelect = document.getElementById("catalog-muni-select");
    if (muniSelect) muniSelect.value = this.selectedMunicipality;
    const catSelect = document.getElementById("catalog-cat-select");
    if (catSelect) catSelect.value = this.selectedCategory;

    this.appEl.querySelectorAll("[data-muni]").forEach(p => {
      p.classList.toggle("active", p.dataset.muni === this.selectedMunicipality);
    });
    this.appEl.querySelectorAll("[data-cat]").forEach(p => {
      p.classList.toggle("active", p.dataset.cat === this.selectedCategory);
    });

    const activeWrap = document.getElementById("catalog-active-pills");
    if (activeWrap) {
      const pillsHtml = this.renderCatalogActivePills();
      activeWrap.innerHTML = pillsHtml;
      activeWrap.style.display = pillsHtml ? "block" : "none";
      this.bindCatalogActivePillEvents();
    }

    this.updateBackBar();
  }

  bindCatalogFilterControls() {
    const searchInput = document.getElementById("catalog-search-input");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        this.searchQuery = e.target.value;
        this.updateCatalogResults();
      });
    }

    const clearSearchBtn = document.getElementById("catalog-clear-search");
    if (clearSearchBtn) {
      clearSearchBtn.addEventListener("click", () => {
        this.searchQuery = "";
        this.updateCatalogResults();
        if (searchInput && typeof searchInput.focus === "function") searchInput.focus();
      });
    }

    const muniSelect = document.getElementById("catalog-muni-select");
    if (muniSelect) {
      muniSelect.addEventListener("change", (e) => {
        this.selectedMunicipality = e.target.value;
        this.updateCatalogResults();
      });
    }

    const catSelect = document.getElementById("catalog-cat-select");
    if (catSelect) {
      catSelect.addEventListener("change", (e) => {
        this.selectedCategory = e.target.value;
        this.updateCatalogResults();
      });
    }

    const drawerToggle = document.getElementById("catalog-drawer-toggle");
    const quickDrawer = document.getElementById("catalog-quick-drawer");
    if (drawerToggle && quickDrawer) {
      drawerToggle.addEventListener("click", () => {
        this.catalogFiltersOpen = !this.catalogFiltersOpen;
        quickDrawer.hidden = !this.catalogFiltersOpen;
        quickDrawer.classList.toggle("is-open", this.catalogFiltersOpen);
        drawerToggle.classList.toggle("is-open", this.catalogFiltersOpen);
        drawerToggle.setAttribute("aria-expanded", this.catalogFiltersOpen ? "true" : "false");
        const span = drawerToggle.querySelector("span");
        if (span) span.textContent = this.catalogFiltersOpen ? "Ocultar fichas" : "Explorar por fichas";
      });
    }

    this.appEl.querySelectorAll("[data-muni]").forEach(pill => {
      pill.addEventListener("click", () => {
        this.selectedMunicipality = pill.dataset.muni;
        this.updateCatalogResults();
      });
    });

    this.appEl.querySelectorAll("[data-cat]").forEach(pill => {
      pill.addEventListener("click", () => {
        this.selectedCategory = pill.dataset.cat;
        this.updateCatalogResults();
      });
    });

    this.bindCatalogActivePillEvents();
  }

  bindRoleViewEvents() {
    this.appEl.querySelectorAll(".subnav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        this.setConsumerTab(btn.dataset.tab);
      });
    });

    const heroExplore = document.getElementById("hero-explore-btn");
    if (heroExplore) heroExplore.addEventListener("click", () => this.setConsumerTab("catalogo"));
    const heroMap = document.getElementById("hero-map-btn");
    if (heroMap) heroMap.addEventListener("click", () => this.setConsumerTab("mapa"));
    const homeSeeAll = document.getElementById("home-see-all-catalog");
    if (homeSeeAll) homeSeeAll.addEventListener("click", () => this.setConsumerTab("catalogo"));
    const homeViewFair = document.getElementById("home-view-fair-btn");
    if (homeViewFair) homeViewFair.addEventListener("click", () => this.setConsumerTab("ferias"));
    const homeViewWorkshop = document.getElementById("home-view-workshop-btn");
    if (homeViewWorkshop) homeViewWorkshop.addEventListener("click", () => this.setConsumerTab("ferias"));

    this.bindCatalogCardEvents(this.appEl);
    this.bindCatalogFilterControls();

    // Map Route Selector Pills (Smooth update without rebuilding map)
    this.appEl.querySelectorAll("#map-route-selector [data-route-id]").forEach(btn => {
      btn.addEventListener("click", () => {
        this.selectMapRoute(btn.dataset.routeId);
      });
    });

    // Fullscreen Toggle & Back button
    const fsBtn = document.getElementById("map-fullscreen-toggle");
    if (fsBtn) {
      fsBtn.addEventListener("click", () => {
        this.toggleMapFullscreen();
      });
    }
    const fsBackBtn = document.getElementById("map-fullscreen-back-btn");
    if (fsBackBtn) {
      fsBackBtn.addEventListener("click", () => {
        this.toggleMapFullscreen(false);
      });
    }

    // Info overlay button
    const infoBtn = document.getElementById("map-info-toggle");
    if (infoBtn) {
      infoBtn.addEventListener("click", () => {
        this.showToast("Mapa Topográfico Zafra · Relieve, rutas productivas y talleres de Morelos", "info");
      });
    }

    // Clic en tarjetas de ruta o botón regresar en el detalle de ruta
    const routeBannerContainer = document.getElementById("route-detail-banner-container");
    if (routeBannerContainer) {
      routeBannerContainer.addEventListener("click", (e) => {
        const backAllBtn = e.target.closest("#map-route-back-btn");
        if (backAllBtn) {
          this.selectMapRoute("all");
          return;
        }
        const card = e.target.closest("[data-pick-route]");
        if (!card) return;
        this.selectMapRoute(card.dataset.pickRoute);
      });
    }

    // Ferias: filtros y apertura de mapa individual emergente + confirmación de visita
    this.appEl.querySelectorAll(".ferias-filter-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        this.feriasFilter = chip.dataset.feriasFilter || "todos";
        const container = document.getElementById("main-view");
        if (container) container.innerHTML = this.renderConsumerEvents();
        this.bindRoleViewEvents();
      });
    });

    this.appEl.querySelectorAll("[data-open-fair-id]").forEach(el => {
      el.addEventListener("click", (e) => {
        if (el.tagName === "BUTTON") e.stopPropagation();
        const itemId = el.dataset.openFairId;
        if (itemId) this.openFairLocationModal(itemId);
      });
      if (el.tagName !== "BUTTON") {
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            const itemId = el.dataset.openFairId;
            if (itemId) this.openFairLocationModal(itemId);
          }
        });
      }
    });

    const consumerChatForm = document.getElementById("consumer-chat-form");
    if (consumerChatForm) {
      consumerChatForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("consumer-chat-input");
        if (input && input.value.trim()) {
          store.addChatMessage("Laura Romero (Tú)", "consumidor", input.value.trim());
          input.value = "";
          setTimeout(() => {
            store.addChatMessage("Valeria (Brigadista UAEM)", "joven", "Recibido. Me encuentro a 10 minutos de la ubicación.");
          }, 1400);
        }
      });
    }

    const profileForm = document.getElementById("profile-form");
    if (profileForm) {
      profileForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const formData = new FormData(profileForm);
        const currentProfile = store.getUserProfile();
        const updated = {
          ...currentProfile,
          name: formData.get("name"),
          phone: formData.get("phone"),
          email: formData.get("email"),
          municipality: formData.get("municipality"),
          preferredTime: formData.get("preferredTime"),
          address: formData.get("address"),
          references: formData.get("references")
        };
        store.saveUserProfile(updated);
        this.showToast("Parámetros guardados correctamente", "success");
      });
    }

    // Producer triggers
    const producerSelect = document.getElementById("producer-account-select");
    if (producerSelect) {
      producerSelect.addEventListener("change", (e) => {
        this.activeProducerId = e.target.value;
        this.producerLotFilter = "todos";
        this.render();
      });
    }

    this.appEl.querySelectorAll(".producer-lot-filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        this.producerLotFilter = btn.dataset.lotFilter || "todos";
        this.render();
      });
    });

    const openAddCrop = document.getElementById("prod-open-add-crop");
    if (openAddCrop) {
      openAddCrop.addEventListener("click", () => this.openAddCropModal());
    }
    const emptyAddCrop = document.getElementById("prod-empty-add-crop");
    if (emptyAddCrop) {
      emptyAddCrop.addEventListener("click", () => this.openAddCropModal());
    }

    this.appEl.querySelectorAll(".toggle-crop-pause").forEach(btn => {
      btn.addEventListener("click", () => {
        this.toggleCropPause(btn.dataset.id);
      });
    });

    this.appEl.querySelectorAll(".edit-crop-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        this.openEditCropModal(btn.dataset.id);
      });
    });

    const markHarvestReady = document.getElementById("btn-mark-harvest-ready");
    if (markHarvestReady) {
      markHarvestReady.addEventListener("click", () => {
        this.showToast("Lote marcado como LISTO para recolección de brigadistas.", "success");
      });
    }

    // Youth triggers
    this.appEl.querySelectorAll(".mark-delivered-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        this.openSignatureModal(btn.dataset.stopId);
      });
    });

    this.appEl.querySelectorAll(".view-signature-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        this.openSignaturePreviewModal(btn.dataset.stopId);
      });
    });

    const downloadCert = document.getElementById("btn-download-certificate");
    if (downloadCert) {
      downloadCert.addEventListener("click", () => this.openCertificateModal());
    }

    const openGeneralDossier = document.getElementById("admin-open-general-dossier");
    if (openGeneralDossier) {
      openGeneralDossier.addEventListener("click", () => this.openAdminNetworkDossierModal());
    }

    this.appEl.querySelectorAll(".admin-inspect-producer").forEach(btn => {
      btn.addEventListener("click", () => {
        this.openAdminProducerDossierModal(btn.dataset.id);
      });
    });

    const saveAdminSettings = document.getElementById("save-admin-settings");
    if (saveAdminSettings) {
      saveAdminSettings.addEventListener("click", () => {
        const current = store.getAdminKPIs();
        const commEl = document.getElementById("admin-commission-input");
        const feeEl = document.getElementById("admin-delivery-fee-input");
        if (commEl) current.commissionRate = Number(commEl.value) || 0;
        if (feeEl) current.deliveryFee = Number(feeEl.value) || 0;
        store.saveAdminKPIs(current);
        this.showToast("Parámetros operativos guardados exitosamente.", "success");
      });
    }

    const homeQuickMap = document.getElementById("home-goto-map-quick");
    if (homeQuickMap) {
      homeQuickMap.addEventListener("click", () => this.setConsumerTab("mapa"));
    }
  }

  openCartModal() {
    const cart = store.getCart();
    const profile = store.getUserProfile();
    const subtotal = cart.reduce((acc, it) => acc + (it.price * it.qty), 0);
    const shipping = subtotal > 0 ? (profile.rewardActive ? 0 : 25) : 0;
    const total = subtotal + shipping;

    this.modalRoot.innerHTML = `
      <div class="modal-overlay" id="modal-bg">
        <div class="modal-dialog" style="max-width: 600px;">
          <div class="modal-dialog-header">
            <h3 class="modal-dialog-title">Canasta de Abastecimiento (${cart.length})</h3>
            <button class="modal-dismiss-btn" id="close-modal-x">&times;</button>
          </div>
          <div class="modal-dialog-body">
            ${cart.length === 0 ? `
              <div style="text-align: center; padding: 36px 16px;">
                <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 16px;">No hay cosechas seleccionadas en este momento.</p>
                <button class="btn btn-primary btn-sm" id="cart-go-catalog-btn">Ver Catálogo en Preventa</button>
              </div>
            ` : `
              <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
                ${cart.map(item => `
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--ui-border); border-radius: var(--radius-sm); background: #fff;">
                    <img src="${item.image}" alt="${item.name}" style="width: 44px; height: 44px; border-radius: var(--radius-xs); object-fit: cover;" />

  setupSignaturePad(canvas, { onChange = null, inkColor = "#1d3a25" } = {}) {
    if (!canvas || typeof canvas.getContext !== "function") return null;
    const ctx = canvas.getContext("2d");
    if (!ctx) return null;

    const rectInit = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { width: 0, height: 0 };
    const logicalWidth = rectInit.width > 0 ? rectInit.width : (Number(canvas.width) || 440);
    const logicalHeight = rectInit.height > 0 ? rectInit.height : (Number(canvas.height) || 170);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(logicalWidth * dpr);
    canvas.height = Math.round(logicalHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    let currentInk = inkColor;
    let isDrawing = false;
    let hasDrawn = false;
    let lastPt = null;
    let lastMid = null;

    const getPoint = (e) => {
      const rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: logicalWidth, height: logicalHeight };
      const w = rect.width || logicalWidth;
      const h = rect.height || logicalHeight;
      const src = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      return {
        x: ((src.clientX - rect.left) / w) * logicalWidth,
        y: ((src.clientY - rect.top) / h) * logicalHeight
      };
    };

    const startStroke = (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (e.cancelable) e.preventDefault();
      if (e.pointerId !== undefined && typeof canvas.setPointerCapture === "function") {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      const pt = getPoint(e);
      isDrawing = true;
      lastPt = pt;
      lastMid = pt;

      ctx.strokeStyle = currentInk;
      ctx.fillStyle = currentInk;
      ctx.lineWidth = 2.4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 1.2, 0, Math.PI * 2);
      ctx.fill();

      if (!hasDrawn) {
        hasDrawn = true;
        if (onChange) onChange(true);
      }
    };

    const moveStroke = (e) => {
      if (!isDrawing) return;
      if (e.cancelable) e.preventDefault();
      const pt = getPoint(e);
      const mid = { x: (lastPt.x + pt.x) / 2, y: (lastPt.y + pt.y) / 2 };

      ctx.strokeStyle = currentInk;
      ctx.lineWidth = 2.4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(lastMid.x, lastMid.y);
      ctx.quadraticCurveTo(lastPt.x, lastPt.y, mid.x, mid.y);
      ctx.stroke();

      lastPt = pt;
      lastMid = mid;
    };

    const endStroke = () => {
      if (!isDrawing) return;
      isDrawing = false;
      lastPt = null;
      lastMid = null;
    };

    if (typeof window.PointerEvent !== "undefined") {
      canvas.addEventListener("pointerdown", startStroke);
      canvas.addEventListener("pointermove", moveStroke);
      canvas.addEventListener("pointerup", endStroke);
      canvas.addEventListener("pointercancel", endStroke);
    } else {
      canvas.addEventListener("mousedown", startStroke);
      canvas.addEventListener("mousemove", moveStroke);
      canvas.addEventListener("mouseup", endStroke);
      canvas.addEventListener("mouseleave", endStroke);
      canvas.addEventListener("touchstart", startStroke, { passive: false });
      canvas.addEventListener("touchmove", moveStroke, { passive: false });
      canvas.addEventListener("touchend", endStroke);
      canvas.addEventListener("touchcancel", endStroke);
    }

    return {
      hasSignature: () => hasDrawn,
      clear: () => {
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);
        hasDrawn = false;
        isDrawing = false;
        lastPt = null;
        lastMid = null;
        if (onChange) onChange(false);
      },
      setInkColor: (color) => {
        currentInk = color;
      },
      toDataURL: () => (typeof canvas.toDataURL === "function" ? canvas.toDataURL("image/png") : "")
    };
  }

            </div>

            <div class="signature-pad-header">

              <div class="signature-tools-row">

                  <button type="button" class="ink-dot" data-ink="#2a2218" style="background: #2a2218;" title="Tinta negra"></button>
                  <button type="button" class="ink-dot" data-ink="#1e3a8a" style="background: #1e3a8a;" title="Tinta azul"></button>
                </div>
                <button type="button" class="btn btn-ghost btn-sm" id="btn-clear-signature">Limpiar firma</button>
              </div>
            </div>

            <div class="signature-pad-wrap" id="signature-pad-box">
              <canvas id="signature-canvas" class="signature-canvas" width="460" height="175"></canvas>
              <span class="signature-pad-hint" id="signature-pad-hint">Traza la firma aquí con tu dedo o cursor</span>
              <div class="signature-baseline"></div>
            </div>

            <div class="signature-status-row">
              <span id="signature-pad-status" class="signature-status-pending">Falta dibujar la firma</span>
              <span style="font-size: 0.72rem; color: var(--text-muted);">+2 hrs al acreditar</span>
            </div>

            <button type="button" class="btn btn-primary btn-block" id="btn-submit-delivery-proof">
              ${Icons.check} ${stop && stop.status === 'completed' ? 'Guardar Nueva Firma' : 'Validar Entrega & Acreditar +2 Horas'}
            </button>
          </div>
        </div>
      </div>
    `;

    this.bindModalClose();

    const canvas = document.getElementById("signature-canvas");
    const hint = document.getElementById("signature-pad-hint");
    const statusEl = document.getElementById("signature-pad-status");
    const padBox = document.getElementById("signature-pad-box");

    const pad = this.setupSignaturePad(canvas, {
      onChange: (drawn) => {
        if (hint) hint.style.display = drawn ? "none" : "block";
        if (statusEl) {
          statusEl.textContent = drawn ? "Firma capturada" : "Falta dibujar la firma";
          statusEl.className = drawn ? "signature-status-ready" : "signature-status-pending";
        }
        if (padBox && drawn) padBox.classList.remove("needs-signature");
      }
    });

    const clearBtn = document.getElementById("btn-clear-signature");
    if (clearBtn && pad) {
      clearBtn.addEventListener("click", () => pad.clear());
    }

    this.modalRoot.querySelectorAll(".ink-dot").forEach(dot => {
      dot.addEventListener("click", () => {
        this.modalRoot.querySelectorAll(".ink-dot").forEach(d => d.classList.remove("active"));
        dot.classList.add("active");
        if (pad) pad.setInkColor(dot.dataset.ink);
      });
    });

    const submitBtn = document.getElementById("btn-submit-delivery-proof");
    if (submitBtn) {
      submitBtn.addEventListener("click", () => {
        if (!pad || !pad.hasSignature()) {
          if (padBox) padBox.classList.add("needs-signature");
          this.showToast("Dibuja la firma en el recuadro antes de validar la entrega", "info");
          return;
        }
        const signerInput = document.getElementById("signature-signer-name");
        const signerName = signerInput && signerInput.value.trim()
          ? signerInput.value.trim()
          : (stop ? stop.clientName : "Receptor");

        const youthRoutes = store.getYouth();
        const route = youthRoutes[0];
        const targetStop = route.stops.find(s => s.id === stopId);
        if (targetStop) {
          const wasCompleted = targetStop.status === "completed";
          targetStop.status = "completed";
          targetStop.signatureDataUrl = pad.toDataURL();
          targetStop.signerName = signerName;
          targetStop.signedAt = new Date().toLocaleString("es-MX", { dateStyle: "short", timeStyle: "short" });
          if (!wasCompleted) {
            route.hoursCompleted += 2;
          }
          store.saveYouth(youthRoutes);
        }
        this.closeModal();
        this.showToast("Firma guardada y entrega acreditada.", "success");
        this.render();
      });
    }
  }

    const target = products.find(p => p.id === productId);
    if (!target) return;
    target.paused = !Boolean(target.paused);
    store.saveProducts(products);
    this.showToast(
      target.paused
        ? `Lote "${target.name}" pausado (oculto del catálogo)`
        : `Lote "${target.name}" activado en catálogo`,
      target.paused ? "info" : "success"
    );
    this.render();
  }

  openAddCropModal() {
    this.openCropModal(null);
  }

  openEditCropModal(productId) {
    this.openCropModal(productId);
  }

  resolveCropImage(category, selectedImage, existingImage) {
    if (selectedImage && selectedImage !== "auto") return selectedImage;
    if (existingImage) return existingImage;
    const match = store.getProducts().find(
      p => p.category === category && p.image && !p.image.startsWith("data:")
    );
    return match ? match.image : "assets/img/prod_ejote.jpg";
  }

  openCropModal(productId = null) {
    const allProducts = store.getProducts();
    const existing = productId ? allProducts.find(p => p.id === productId) : null;
    const isEdit = Boolean(existing);
    const producer = this.getActiveProducer();

    const baseUnits = ["kg", "docena", "pieza", "manojo", "bolsa", "frasco", "litro", "charola", "botella", "caja"];
    const currentUnit = existing ? existing.unit : "kg";
    const unitOptions = baseUnits.includes(currentUnit) ? baseUnits : [currentUnit, ...baseUnits];

    const presetImages = [];
    const seenImgs = new Set();
    allProducts.forEach(item => {
      if (item.image && !item.image.startsWith("data:") && !seenImgs.has(item.image) && presetImages.length < 36) {
        seenImgs.add(item.image);
        presetImages.push({ image: item.image, label: `${item.name} (${item.category})` });
      }
    });

    const curCategory = existing ? existing.category : ZAFRA_CATEGORIES[0];
    const curHarvest = existing ? (existing.harvestDate || existing.availability || "") : "";
    const curDelivery = existing ? (existing.delivery || "Entrega en punto Zafra o domicilio local") : "Entrega en punto Zafra o domicilio local";
    const curDesc = existing ? (existing.description || "") : "Lote de corte fresco bajo pedido.";
    const curPreventa = existing ? Boolean(existing.isPreventa) : true;
    const curPaused = existing ? Boolean(existing.paused) : false;

    this.modalRoot.innerHTML = `
      <div class="modal-overlay" id="modal-bg">
        <div class="modal-dialog">
          <div class="modal-dialog-header">
            <h3 class="modal-dialog-title">${isEdit ? "Editar Lote de Cosecha" : "Agregar Nuevo Lote"}</h3>
            <button type="button" class="modal-dismiss-btn" id="close-modal-x">&times;</button>
          </div>
          <div class="modal-dialog-body">
            <form id="new-crop-form">
              <div class="form-group-item">
                <label class="form-label-title">Nombre del Producto / Cultivo</label>
                <input type="text" class="form-input-control" name="name" value="${this.escapeHtml(existing ? existing.name : "")}" placeholder="Ej. Calabacita criolla, Ciruela, Miel..." required />
              </div>

              <div class="crop-modal-row">
                <div class="form-group-item">
                  <label class="form-label-title">Precio Unitario ($ MXN)</label>
                  <input type="number" step="0.01" min="1" class="form-input-control" name="price" value="${existing ? Number(existing.price) : ""}" placeholder="Ej. 28" required />
                </div>
                <div class="form-group-item">
                  <label class="form-label-title">Unidad de Venta</label>
                  <select class="form-input-control" name="unit">
                    ${unitOptions.map(u => `<option value="${this.escapeHtml(u)}" ${u === currentUnit ? "selected" : ""}>${this.escapeHtml(u)}</option>`).join("")}
                  </select>
                </div>
              </div>

              <div class="crop-modal-row">
                <div class="form-group-item">
                  <label class="form-label-title">Stock / Volumen Disponible</label>
                  <input type="number" min="0" class="form-input-control" name="stock" value="${existing ? Number(existing.stock ?? 0) : ""}" placeholder="Ej. 60" required />
                </div>
                <div class="form-group-item">
                  <label class="form-label-title">Categoría</label>
                  <select class="form-input-control" name="category">
                    ${ZAFRA_CATEGORIES.map(c => `<option value="${this.escapeHtml(c)}" ${c === curCategory ? "selected" : ""}>${this.escapeHtml(c)}</option>`).join("")}
                  </select>
                </div>
              </div>

              <div class="crop-modal-row">
                <div class="form-group-item">
                  <label class="form-label-title">Modalidad de Venta</label>
                  <select class="form-input-control" name="isPreventa">
                    <option value="true" ${curPreventa ? "selected" : ""}>Preventa (corte bajo pedido)</option>
                    <option value="false" ${!curPreventa ? "selected" : ""}>Disponible inmediato</option>
                  </select>
                </div>
                <div class="form-group-item">
                  <label class="form-label-title">Estado del Lote</label>
                  <select class="form-input-control" name="paused">
                    <option value="false" ${!curPaused ? "selected" : ""}>Activo (visible en catálogo)</option>
                    <option value="true" ${curPaused ? "selected" : ""}>Pausado temporalmente</option>
                  </select>
                </div>
              </div>

              <div class="form-group-item">
                <label class="form-label-title">Disponibilidad / Fecha de Corte</label>
                <input type="text" class="form-input-control" name="harvestDate" value="${this.escapeHtml(curHarvest)}" placeholder="Ej. Corte Jueves · Entrega Sábado" required />
              </div>

              <div class="form-group-item">
                <label class="form-label-title">Opciones de Entrega</label>
                <input type="text" class="form-input-control" name="delivery" value="${this.escapeHtml(curDelivery)}" placeholder="Ej. Entrega en punto Zafra, feria o domicilio" />
              </div>

              <div class="form-group-item">
                <label class="form-label-title">Descripción Corta</label>
                <input type="text" class="form-input-control" name="description" value="${this.escapeHtml(curDesc)}" placeholder="Ej. Cosecha de temporal sin agroquímicos" />
              </div>

              <div class="form-group-item">
                <label class="form-label-title">Imagen del Lote</label>
                <select class="form-input-control" name="image">
                  ${isEdit && existing.image ? `<option value="${this.escapeHtml(existing.image)}" selected>Mantener imagen actual</option>` : `<option value="auto" selected>Automática según la categoría</option>`}
                  ${presetImages.map(pi => `<option value="${this.escapeHtml(pi.image)}">${this.escapeHtml(pi.label)}</option>`).join("")}
                </select>
              </div>

              <div class="crop-modal-actions">
                <button type="submit" class="btn btn-primary btn-block">
                  ${isEdit ? "Guardar Cambios del Lote" : "Publicar Lote en Catálogo"}
                </button>
                ${isEdit ? `
                  <button type="button" class="btn btn-ghost btn-block crop-delete-btn" id="crop-delete-btn">
                    Eliminar lote del padrón
                  </button>
                ` : ""}
              </div>
            </form>
          </div>
        </div>
      </div>
    `;

    this.bindModalClose();

    const form = document.getElementById("new-crop-form");
    if (form) {
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const name = String(formData.get("name") || "").trim();
        const category = String(formData.get("category") || ZAFRA_CATEGORIES[0]);
        const price = Number(formData.get("price"));
        const unit = String(formData.get("unit") || "kg");
        const stock = Number(formData.get("stock") || 0);
        const harvestDate = String(formData.get("harvestDate") || "").trim();
        const delivery = String(formData.get("delivery") || "").trim();
        const description = String(formData.get("description") || "").trim();
        const isPreventa = formData.get("isPreventa") === "true";
        const paused = formData.get("paused") === "true";
        const chosenImage = String(formData.get("image") || "auto");

        const products = store.getProducts();
        if (isEdit) {
          const idx = products.findIndex(p => p.id === productId);
          if (idx !== -1) {
            const updated = {
              ...products[idx],
              name,
              category,
              price,
              unit,
              stock,
              harvestDate,
              availability: harvestDate,
              delivery: delivery || products[idx].delivery,
              description: description || products[idx].description,
              isPreventa,
              paused,
              image: this.resolveCropImage(category, chosenImage, products[idx].image)
            };
            products[idx] = updated;
            store.saveProducts(products);

            // Sincronizar nombre/precio/unidad si el producto ya está en la canasta
            const cart = store.getCart();
            let cartChanged = false;
            cart.forEach(item => {
              if (item.id === updated.id) {
                item.name = updated.name;
                item.price = updated.price;
                item.unit = updated.unit;
                item.image = updated.image;
                cartChanged = true;
              }
            });
            if (cartChanged) store.saveCart(cart);
          }
          this.closeModal();
          this.showToast(`Lote "${name}" actualizado correctamente.`, "success");
          this.render();
          return;
        }

        const newProduct = {
          id: `p-${Date.now()}`,
          name,
          producerId: producer.id,
          producerName: producer.name,
          municipality: producer.municipality,
          price,
          unit,
          image: this.resolveCropImage(category, chosenImage, null),
          isPreventa,
          paused,
          harvestDate,
          availability: harvestDate,
          delivery: delivery || "Entrega en punto Zafra o domicilio local",
          stock,
          category,
          tags: ["Sin agroquímicos", "Cosecha fresca"],
          description: description || "Lote de corte fresco bajo pedido."
        };

        products.unshift(newProduct);
        store.saveProducts(products);
        this.closeModal();
        this.showToast(`Lote "${newProduct.name}" agregado con éxito.`, "success");
        this.render();
      });
    }

    const delBtn = document.getElementById("crop-delete-btn");
    if (delBtn && isEdit) {
      let armed = false;
      delBtn.addEventListener("click", () => {
        if (!armed) {
          armed = true;
          delBtn.textContent = "Toca otra vez para confirmar eliminación";
          delBtn.classList.add("is-armed");
          return;
        }
        const remaining = store.getProducts().filter(p => p.id !== productId);
        store.saveProducts(remaining);
        this.closeModal();
        this.showToast(`Lote "${existing.name}" eliminado.`, "info");
        this.render();
      });
    }
  }

                <div class="dossier-section-title">Dictamen Técnico de Cumplimiento</div>

                  <li><span>✓</span> Manejo limpio sin agroquímicos agresivos y trazabilidad directa por lote.</li>
